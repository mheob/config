packages:
  - packages/*

catalogMode: prefer

catalog:
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.3
  "@cspell/dict-de-de": ^4.1.2
  "@mheob/changeset-changelog": ^3.0.2
  "@types/node": ^26.6.3
  cspell: ^10.3.5
  cve-lite-cli: ^1.37.0
  czg: ^1.14.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  eslint-plugin-jsonc: ^3.4.2
  eslint-plugin-regexp: ^3.3.1
  eslint-plugin-storybook: ^10.6.0
  eslint-plugin-yml: ^3.8.1
  lefthook: ^2.1.14
  oxfmt: ^0.71.0
  oxlint: ^1.86.0
  oxlint-tsgolint: ^7.0.2003
  tsdown: ^0.23.0
  turbo: ^2.11.5
  typescript: ^7.0.2

# Exclude trusted packages from the age gate
minimumReleaseAgeExclude:
  - "@mheob/*"

overrides:
  flatted: ^3.4.2
  minimatch: ^10.2.3
  picomatch: ^4.0.4

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  unrs-resolver: true
