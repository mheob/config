packages:
  - packages/*

catalogMode: prefer

catalog:
  "@changesets/cli": ^3.0.1
  "@commitlint/cli": ^21.2.2
  "@cspell/dict-de-de": ^4.1.2
  "@mheob/changeset-changelog": ^3.0.2
  "@types/node": ^26.4.1
  cspell: ^10.2.0
  cve-lite-cli: ^1.33.0
  czg: ^1.14.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  eslint-plugin-jsonc: ^3.4.2
  eslint-plugin-regexp: ^3.2.0
  eslint-plugin-storybook: ^10.6.0
  eslint-plugin-yml: ^3.8.1
  lefthook: ^2.1.12
  oxfmt: ^0.66.0
  oxlint: ^1.81.0
  oxlint-tsgolint: ^7.0.2001
  tsdown: ^0.23.0
  turbo: ^2.10.12
  typescript: ^7.0.2

# Exclude trusted packages from the age gate
minimumReleaseAgeExclude:
  - "@mheob/*"

overrides:
  flatted: ^3.4.2
  minimatch: ^10.2.3
  picomatch: ^4.0.4

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  unrs-resolver: true
