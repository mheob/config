packages:
  - packages/*

catalogMode: prefer

catalog:
  "@changesets/cli": ^3.0.3
  "@commitlint/cli": ^21.2.3
  "@cspell/dict-de-de": ^4.1.2
  "@mheob/changeset-changelog": ^3.0.2
  "@types/node": ^26.6.3
  cspell: ^10.3.5
  cve-lite-cli: ^1.37.0
  czg: ^1.14.0
  eslint-plugin-better-tailwindcss: ^4.7.0
  eslint-plugin-regexp: ^3.3.1
  eslint-plugin-storybook: ^10.6.0
  lefthook: ^2.1.14
  oxlint: 1.85.0
  oxlint-tsgolint: 7.0.2003
  smol-toml: ^1.9.0
  tailwindcss: ^4.3.3
  turbo: ^2.11.5
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

# Exclude trusted packages from the age gate
minimumReleaseAgeExclude:
  - "@mheob/*"

overrides:
  flatted: ^3.4.2
  minimatch: ^10.2.3
  picomatch: ^4.0.4
  vite@*: "catalog:"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lefthook: true
  unrs-resolver: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
