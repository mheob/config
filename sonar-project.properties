# CI-based analysis, run by `.github/workflows/check.yml` after the tests.
# Automatic Analysis has to stay off in SonarQube Cloud, it can't import coverage reports.
sonar.projectKey=mheob_config
sonar.organization=mheob

# The whole repository is analyzed, the tests are the `*.test.ts` files of the packages.
sonar.sources=.
sonar.exclusions=**/test/**,coverage/**,**/dist/**,**/CHANGELOG.md
sonar.tests=packages
sonar.test.inclusions=packages/*/test/**/*.test.ts

# Coverage is measured for the package sources, see the `test` block in `vite.config.ts`.
# The repository tooling and the build configs have no tests.
sonar.coverage.exclusions=scripts/**,*.config.ts,packages/*/vite.config.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
